name: HydroAI Azure Deployment

on:
  push:
    branches: [ "main" ] # Eğer GitHub'da branch adın 'master' ise burayı master yap

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Azure Kayıt Defterine (ACR) Giriş
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # 2. Docker İmajını Oluştur ve Depoya Gönder
    - name: Build and push image
      run: |
        docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/hydroai:latest
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/hydroai:latest

    # 3. Web Uygulamasını Yeni İmajla Güncelle
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'hydroponicsystem' # Senin publish profilindeki msdeploySite ismin bu.
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ secrets.REGISTRY_LOGIN_SERVER }}/hydroai:latest'
