name: HydroAI Azure Deployment (Code)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Deploy paketini hazırla: sadece bulutta gereken dosyalar.
    # torch/ultralytics içeren requirements.txt yerine slim olanı koy,
    # Jetson'a özel dosyaları ve 5.8MB'lık YOLO modelini pakete alma.
    - name: Prepare deployment package
      run: |
        mkdir -p package
        cp server.py package/
        cp -r static package/
        cp requirements-azure.txt package/requirements.txt

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'hydroponicsystem'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: package
