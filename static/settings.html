<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ayarları - HydroAI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <style>
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .btn-save {
            background-color: var(--primary);
            color: #000;
            font-weight: 600;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.3s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #ef4444;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="top-section">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>HydroAI</span>
                </div>
                <nav class="menu">
                    <ul>
                        <li><a href="/"><i class="fas fa-home"></i> Ana Panel</a></li>
                        <li><a href="/analysis"><i class="fas fa-chart-line"></i> Analizler</a></li>
                        <li><a href="/history"><i class="fas fa-history"></i> Geçmiş Kayıtlar</a></li>
                        <li><a href="/settings" class="active"><i class="fas fa-cog"></i> Sistem Ayarları</a></li>
                    </ul>
                </nav>
            </div>
            <!-- Status Same as Index -->
            <div class="system-status">
                <div class="status-item"><span>Server</span>
                    <div class="dot active"></div>
                </div>
                <div class="status-item"><span>Kamera</span>
                    <div class="dot active"></div>
                </div>
                <div class="status-item"><span>Jetson Al</span>
                    <div class="dot"></div>
                </div>
                <small style="color: #64748b; margin-top: 10px; display: block;">v1.0.2 Stable</small>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Sistem Ayarları</h1>
                    <p style="color: #94a3b8;">Otomasyon Parametreleri ve Konfigürasyon</p>
                </div>
            </header>

            <form>
                <div class="settings-grid">
                    <!-- Sensor Thresholds -->
                    <div class="card">
                        <h3
                            style="margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                            <i class="fas fa-sliders-h"></i> Sensör Limitleri
                        </h3>

                        <div class="form-group">
                            <label>Hedef pH Aralığı (Min - Max)</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="number" step="0.1" class="form-control" value="5.5">
                                <span style="align-self: center;">-</span>
                                <input type="number" step="0.1" class="form-control" value="6.5">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Hedef EC Değeri (mS/cm)</label>
                            <input type="number" step="0.1" class="form-control" value="1.5">
                        </div>

                        <div class="form-group">
                            <label>Sıcaklık Alarm Eşiği (°C)</label>
                            <input type="number" class="form-control" value="28">
                        </div>
                    </div>

                    <!-- Automation & Notifications -->
                    <div class="card">
                        <h3
                            style="margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                            <i class="fas fa-robot"></i> Otomasyon & Bildirim
                        </h3>

                        <div class="form-group"
                            style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin:0;">Otomatik Pompa Kontrolü</label>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="form-group"
                            style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin:0;">Yapay Zeka Anlık Analiz</label>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="form-group">
                            <label>Bildirim E-postası</label>
                            <input type="email" class="form-control" value="admin@sera.com">
                        </div>

                        <div class="form-group">
                            <label>Kamera Kayıt Aralığı (Dakika)</label>
                            <select class="form-control">
                                <option>15 Dakika</option>
                                <option selected>30 Dakika</option>
                                <option>60 Dakika</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 30px; display: flex; gap: 20px;">
                    <div style="flex: 2;">
                        <button type="button" class="btn-save" onclick="alert('Ayarlar başarıyla kaydedildi!')">
                            <i class="fas fa-save"></i> Değişiklikleri Kaydet
                        </button>
                    </div>
                    <div style="flex: 1;">
                        <button type="button" class="btn-danger"
                            onclick="confirm('Sistemi yeniden başlatmak istediğinize emin misiniz?')">
                            <i class="fas fa-power-off"></i> Sistemi Yeniden Başlat
                        </button>
                    </div>
                </div>
            </form>

        </main>
    </div>
</body>

</html>
