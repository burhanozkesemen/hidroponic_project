<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - HydroAI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="top-section">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>HydroAI</span>
                </div>
                <nav class="menu">
                    <ul>
                        <li><a href="/"><i class="fas fa-home"></i> Dashboard</a></li>
                        <li><a href="/analysis"><i class="fas fa-chart-line"></i> Analytics</a></li>
                        <li><a href="/history"><i class="fas fa-history"></i> History</a></li>
                        <li><a href="/settings" class="active"><i class="fas fa-cog"></i> Settings</a></li>
                    </ul>
                </nav>
            </div>
            <!-- Status Same as Index -->
            <div class="system-status">
                <div class="status-item"><span>Server</span>
                    <div class="dot active"></div>
                </div>
                <div class="status-item"><span>Camera</span>
                    <div class="dot active"></div>
                </div>
                <div class="status-item"><span>AI Engine</span>
                    <div class="dot"></div>
                </div>
                <small style="color: #64748b; margin-top: 10px; display: block;">v1.0.2 Stable</small>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>System Settings</h1>
                    <p style="color: #94a3b8;">Parameters & Configuration</p>
                </div>
            </header>

            <form>
                <div class="settings-grid">
                    <!-- Sensor Thresholds -->
                    <div class="card">
                        <h2><i class="fas fa-sliders-h" style="color: var(--primary);"></i> Sensor Limits</h2>

                        <div class="form-group">
                            <label>Target pH Range (Min)</label>
                            <input type="number" step="0.1" class="form-control" value="5.5" placeholder="5.5">
                        </div>

                        <div class="form-group">
                            <label>Target pH Range (Max)</label>
                            <input type="number" step="0.1" class="form-control" value="6.5" placeholder="6.5">
                        </div>

                        <div class="form-group">
                            <label>Target EC Value (mS/cm)</label>
                            <input type="number" step="0.1" class="form-control" value="1.5" placeholder="1.5">
                        </div>

                        <div class="form-group">
                            <label>Temperature Alarm Threshold (°C)</label>
                            <input type="number" class="form-control" value="28" placeholder="28">
                        </div>
                    </div>

                    <!-- Automation & Notifications -->
                    <div class="card">
                        <h2><i class="fas fa-magic" style="color: var(--primary);"></i> Automation</h2>

                        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
                            <label style="margin:0; font-weight: 500;">Automatic Pump Control</label>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
                            <label style="margin:0; font-weight: 500;">AI Real-time Analysis</label>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="form-group">
                            <label>Notification Email</label>
                            <input type="email" class="form-control" value="admin@hydro.ai" placeholder="admin@hydro.ai">
                        </div>

                        <div class="form-group">
                            <label>Camera Recording Interval</label>
                            <select class="form-control">
                                <option>15 Minutes</option>
                                <option selected>30 Minutes</option>
                                <option>60 Minutes</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 30px; display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                    <button type="button" class="btn btn-primary" onclick="alert('⚙️ Settings saved successfully!'); return false;">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <button type="button" class="btn" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 2px solid var(--danger);" onclick="confirm('Are you sure? This will restart the system.') && alert('System restarting...'); return false;">
                        <i class="fas fa-power-off"></i> Restart System
                    </button>
                </div>
            </form>

        </main>
    </div>
</body>

</html>
